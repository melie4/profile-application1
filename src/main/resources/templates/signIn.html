<!DOCTYPE HTML>

<html xmlns:th = "http://www.thymeleaf.org">

<head>
    <title>sign-in</title>
    <meta http-equiv = "Content-Type" content = "text/html; charset = UTF-8"/>
    <link th:href="@{/css/signIn.css}" rel="stylesheet">
</head>

<body>
    <header>
        <div class = "container">
            <div class = "header-left">
                <h2>My Portfolio</h2>
            </div>
            <div class = "header-right">
                <input type="submit" class = "login-btn" value = "ログイン" />
            </div>
            
        </div>
    </header>


    <div class = "register-main">

        <div class = "container">
            <p th:text = "${title}"></p>
            <form method = "post" th:action="@{/}" th:object = "${userModel}">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
                <div class = "form-all">
                    <div class = "form">
                        <label for="name" class = "form-label">氏名</label>
                        <input type="text" class = "form-control" th:field = "*{name}" />
                        <div class = "err" th:if = "${#fields.hasErrors('name')}" th:errors = "*{name}" ></div>
                    </div>

                    <div class = "form">
                        <label for="email" class = "form-label">メールアドレス</label>
                        <input type="text" class = "form-control" th:field = "*{email}" />
                        <div class = "err" th:if = "${#fields.hasErrors('email')}" th:errors = "*{email}" ></div>
                        <div class = "err" th:if = "${errorMessage}" th:text = "${errorMessage}"></div>
                    </div>

                    <div class = "form">
                        <label for="password" class = "form-label">パスワード</label>
                        <input type="password" class = "form-control" th:field = "*{password}" />
                        <div class = "err" th:if = "${#fields.hasErrors('password')}" th:errors = "*{password}" ></div>
                    </div>

                </div>

                <input type="submit" class = "btn" value = "登録する" />

            </form>
        </div>
    </div>

    <footer>
        <div class = "container">
            <p>portfolio site</p>
        </div>
    </footer>
</body>
