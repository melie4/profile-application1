<!DOCTYPE HTML>

<html xmlns:th = "http://www.thymeleaf.org">

<head>
    <title>自己紹介編集</title>
    <meta http-equiv = "Content-Type" content = "text/html; charset = UTF-8"/>
    <link th:href="@{/css/profileEdit.css}" rel="stylesheet">
</head>

<body>
    <header>
        <div class = "header-left">
            <a th:href="@{/top}" class = "header-title">My Portfolio</a>
        </div>
        <div class = "header-right">
            <form method = "post" th:action = "@{/logout}">
                <input type="submit" class = "logout-btn" value = "ログアウト" />
            </form>
        </div>
    </header>


    <div class = "profile-edit-main">

        <div class = "container">
            <div class = "title">自己紹介を編集する</div>
            <form method = "post" th:action="@{/profile-edit}" th:object = "${userModel}" enctype = "multipart/form-data" id = "profileEditForm">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
                
                <div class = "form-all">

                    <div class = "form">
                        <label for="selfIntroduction" class = "form-label">自己紹介文</label>
                        <textarea class = "form-control" th:field = "*{selfIntroduction}" id = "selfIntroductionText"></textarea>
                        <div class = "err" th:if = "${#fields.hasErrors('selfIntroduction')}" th:errors = "*{selfIntroduction}"></div>
                        <div class="err" id="selfIntroductionError"></div>
                    </div>

                    <div class = "form">
                        <label class = "form-label avatar-label">アバター画像</label>

                        <label for="avatarImage" class = "image-select-btn">画像ファイルを添付する</label>
                        <span id = "fileName"></span>

                        <input type="file" name = "avatarImage" id="avatarImage" accept = "image/*">
                        <div class = "err" id = "avatarImageError"></div>
                    </div>
                    

                </div>


                <button type="submit" class = "btn btn-profile-edit">自己紹介を確定する</button>

            </form>
        </div>
    </div>

    <footer>
        <div class = "container">
            <p>portfolio site</p>
        </div>
    </footer>

    <script>
        //画像ファイル添付時に、ファイル名を取得
        const avatarImage = document.getElementById("avatarImage");
        const fileName = document.getElementById("fileName");
        const avatarImageError = document.getElementById("avatarImageError");

        avatarImage.addEventListener("change",function(){
            avatarImageError.textContent = "";

            if(avatarImage.files.length > 0){
                const file = avatarImage.files[0];
                fileName.textContent = file.name;

                const maxFileSize = 5*1024*1024;
                if(file.size > maxFileSize)
                {
                    avatarImageError.textContent = "アバター画像は5MB以下のファイルを選択してください" ;
                }
            }
            else{
                fileName.textContent = "";
            }
        })

        //POST前に自己紹介文をバリデーションチェック
        const form = document.getElementById("profileEditForm");
        const selfIntroductionText = document.getElementById("selfIntroductionText");
        const errorMessage = document.getElementById("selfIntroductionError");
        
        form.addEventListener("submit", function(event) {

            let hasError = false;

            if(selfIntroductionText.value.length < 50 || 
                selfIntroductionText.value.length > 200)
            {
                event.preventDefault();
                errorMessage.textContent = "自己紹介は50文字以上200文字以下で入力してください";
                
                hasError = true;
            }
            else
            {
                errorMessage.textContent = "";
            }


            if(avatarImage.files.length > 0)
            {
                const file = avatarImage.files[0];
                const maxFileSize = 5*1024*1024;

                if(file.size > maxFileSize){
                    avatarImageError.textContent = "アバター画像は5MB以下のファイルを選択してください";

                    hasError = true;
                }
                else
                {
                    avatarImageError.textContent = "";
                }
            }
            
            if(hasError)
            {
                event.preventDefault();
                return;
            }      
        });

    </script>
</body>
